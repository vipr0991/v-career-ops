name: CI — Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Install dashboard deps
        run: npm ci
        working-directory: dashboard-web

      - name: Build dashboard (verify no compile errors)
        run: npm run build
        working-directory: dashboard-web
        env:
          VITE_API_BASE: https://vcareer-ops-production.up.railway.app

  docker-build:
    name: Docker Build (Railway Parity)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/career-ops-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/career-ops-api:${{ github.sha }}

      - name: Build & push PDF worker image
        uses: docker/build-push-action@v6
        with:
          context: ./pdf-worker
          file: ./pdf-worker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/career-ops-pdf-worker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/career-ops-pdf-worker:${{ github.sha }}

  health-check:
    name: Smoke Test Railway Deployment
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Wait for Railway to redeploy
        run: sleep 60

      - name: Health check API
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://vcareer-ops-production.up.railway.app/health)
          if [ "$status" != "200" ]; then
            echo "Health check failed: HTTP $status"
            exit 1
          fi
          echo "API health check passed: HTTP $status"
