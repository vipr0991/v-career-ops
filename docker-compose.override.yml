version: '3.8'

# Local development overrides.
# Loaded automatically alongside docker-compose.yml when you run:
#   docker compose up --build
#
# Differences from production:
#   - api/pdf-worker point at the local Supabase stack (127.0.0.1:54321)
#   - Volumes mounted for hot-reload where applicable
#   - dashboard has VITE_API_BASE set to local api container

services:
  api:
    environment:
      - NODE_ENV=development
      - SUPABASE_URL=http://host.docker.internal:54321
      - SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
