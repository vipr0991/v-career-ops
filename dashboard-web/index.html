<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Career-Ops Dashboard — AI-powered job search, scoring, resume tailoring, and auto-apply platform for strategic career advancement." />
    <title>Career-Ops — AI-Powered Job Search Dashboard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <!-- Google reCAPTCHA v3 -->
    <script src="https://www.google.com/recaptcha/api.js?render=6LebFoctAAAAAEdiBxpm_qy7XUu_2wqZP714cStG"></script>
  </head>
  <body>
    <div id="auth-overlay" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#111827;z-index:999999;display:none;flex-direction:column;justify-content:center;align-items:center;color:#fff;font-family:Inter,sans-serif;">
      <div style="background:#1f2937;padding:2rem;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,0.3);width:100%;max-width:400px;box-sizing:border-box;">
        <h2 style="margin-top:0;margin-bottom:1.5rem;text-align:center;">Career-Ops Sign In</h2>
        <input type="email" id="auth-id" placeholder="ID (Email)" style="width:100%;padding:0.75rem;margin-bottom:1rem;border-radius:4px;border:1px solid #374151;background:#111827;color:white;box-sizing:border-box;" />
        <input type="password" id="auth-pass" placeholder="Password" style="width:100%;padding:0.75rem;margin-bottom:1rem;border-radius:4px;border:1px solid #374151;background:#111827;color:white;box-sizing:border-box;" />
        <input type="hidden" id="recaptchaToken" name="recaptcha_token" />
        <button id="auth-btn" style="width:100%;padding:0.75rem;border-radius:4px;border:none;background:#3b82f6;color:white;font-weight:bold;cursor:pointer;">Sign In</button>
        <p id="auth-error" style="color:#ef4444;margin-top:1rem;text-align:center;display:none;">Invalid credentials</p>
      </div>
    </div>
    
    <script>
      if (sessionStorage.getItem('authenticated') !== 'true') {
        document.getElementById('auth-overlay').style.display = 'flex';
        document.getElementById('auth-btn').onclick = function() {
          var btn = document.getElementById('auth-btn');
          var err = document.getElementById('auth-error');
          var id = document.getElementById('auth-id').value;
          var pass = document.getElementById('auth-pass').value;

          err.style.display = 'none';
          btn.disabled = true;
          btn.innerText = 'Verifying...';

          function verifyAndLogin(token) {
            btn.disabled = false;
            btn.innerText = 'Sign In';
            if (token) {
              var hiddenField = document.getElementById('recaptchaToken');
              if (hiddenField) hiddenField.value = token;
            }

            if (id === '6vinay9@gmail.com' && pass === '#g0!ng2AUS') {
              sessionStorage.setItem('authenticated', 'true');
              document.getElementById('auth-overlay').style.display = 'none';
            } else {
              err.innerText = 'Invalid credentials';
              err.style.display = 'block';
            }
          }

          if (typeof grecaptcha !== 'undefined') {
            grecaptcha.ready(function() {
              grecaptcha.execute('6LebFoctAAAAAEdiBxpm_qy7XUu_2wqZP714cStG', {action: 'login'})
                .then(function(token) {
                  verifyAndLogin(token);
                })
                .catch(function(e) {
                  console.warn('reCAPTCHA execution error:', e);
                  verifyAndLogin(null);
                });
            });
          } else {
            verifyAndLogin(null);
          }
        };
      }
    </script>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
