version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# Career-Ops Active Stack (Python FastAPI + React Dashboard)
# Matches live Railway API + Vercel dashboard architecture.
#
# Usage:
#   docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career-ops-api
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=5000
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - ./reports:/app/reports
      - ./output:/app/output
      - ./resumes:/app/resumes
      - ./latex_resumes:/app/latex_resumes
      - ./config:/app/config
    networks:
      - career-ops-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  dashboard:
    build:
      context: ./dashboard-web
      dockerfile: Dockerfile
    container_name: career-ops-dashboard
    restart: unless-stopped
    ports:
      - "5174:5174"
    environment:
      - VITE_API_BASE=http://api:5000
      - NODE_ENV=development
    depends_on:
      api:
        condition: service_healthy
    networks:
      - career-ops-net

networks:
  career-ops-net:
    driver: bridge
